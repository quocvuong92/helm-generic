apiVersion: v2
name: generic
description: A flexible, generic Helm chart for deploying any containerized application to Kubernetes
type: application
version: 2.2.0
appVersion: "2.0.0"
kubeVersion: ">=1.23.0-0"
maintainers:
  - name: vuongq
    email: quocvuongus@gmail.com
    url: https://vuonghq.tech
keywords:
  - generic
  - deployment
  - statefulset
  - daemonset
  - cronjob
  - kubernetes
home: https://github.com/quocvuong92/helm-generic
icon: https://raw.githubusercontent.com/cncf/artwork/master/projects/helm/icon/color/helm-icon-color.svg
sources:
  - https://github.com/quocvuong92/helm-generic
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: Set pullable nginx default image tag
    - kind: fixed
      description: Reject invalid string values for optional integer workload fields
    - kind: fixed
      description: Render pod terminationGracePeriodSeconds when set to 0
    - kind: fixed
      description: Validate RBAC rules before rendering
    - kind: fixed
      description: Gate CronJob timeZone to Kubernetes 1.27+
    - kind: added
      description: Validation fixtures for RBAC, CronJob timezone, integer fields, and zero values
  artifacthub.io/license: MIT
