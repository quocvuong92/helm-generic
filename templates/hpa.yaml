{{- if .Values.autoscaling.enabled }}
{{- include "generic.validateHPA" . }}
{{- $metrics := default dict .Values.autoscaling.metrics }}
{{- $cpu := default dict (get $metrics "cpu") }}
{{- $memory := default dict (get $metrics "memory") }}
{{- $custom := default list (get $metrics "custom") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "generic.fullname" . }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  {{- include "generic.renderAnnotations" (dict "global" . "local" .Values.autoscaling.annotations) | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    {{- if eq (include "generic.workloadType" .) "statefulset" }}
    kind: StatefulSet
    {{- else }}
    kind: Deployment
    {{- end }}
    name: {{ include "generic.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if and (hasKey $cpu "enabled") (get $cpu "enabled") }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cpu.averageUtilization }}
    {{- end }}
    {{- if and (hasKey $memory "enabled") (get $memory "enabled") }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $memory.averageUtilization }}
    {{- end }}
    {{- with $custom }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
