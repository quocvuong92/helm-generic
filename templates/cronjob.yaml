{{- if eq (include "generic.workloadType" .) "cronjob" }}
{{- include "generic.validatePodLabels" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "generic.fullname" . }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  {{- include "generic.renderAnnotations" (dict "global" . "local" nil) | nindent 2 }}
spec:
  schedule: {{ .Values.workload.cronjob.schedule | quote }}
  {{- with .Values.workload.cronjob.timeZone }}
  {{- if semverCompare ">=1.27.0-0" $.Capabilities.KubeVersion.Version }}
  timeZone: {{ . | quote }}
  {{- else }}
  {{- fail (printf "CronJob timeZone requires Kubernetes 1.27+, but target cluster is %s. Remove workload.cronjob.timeZone or upgrade the cluster." $.Capabilities.KubeVersion.Version) }}
  {{- end }}
  {{- end }}
  concurrencyPolicy: {{ .Values.workload.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.workload.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.workload.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      {{- if ne (toString .Values.workload.cronjob.backoffLimit) "" }}
      backoffLimit: {{ .Values.workload.cronjob.backoffLimit }}
      {{- end }}
      {{- if ne (toString .Values.workload.cronjob.activeDeadlineSeconds) "" }}
      activeDeadlineSeconds: {{ .Values.workload.cronjob.activeDeadlineSeconds }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "generic.podLabels" . | nindent 12 }}
          {{- with .Values.pod.annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: {{ .Values.workload.cronjob.restartPolicy }}
          {{- include "generic.podSpec" . | nindent 10 }}
{{- end }}
